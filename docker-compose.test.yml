services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory_test_db
    ports:
      - "5433:5432"

  app:
    image: golang:1.27
    container_name: inventory-integration-test-app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://inventory_user:inventory_password@db:5432/inventory_test_db?sslmode=disable
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: ["go", "test", "-v", "-tags=integration", "./internal/repository/..."]
